services:
  - type: web
    name: edulearn-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: edulearn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://e-learning-three-phi.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://e-leraning.onrender.com/api/auth/google/callback
      - key: PAYMENT_GATEWAY_MODE
        value: mock
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: admin@edulearn.com
      - key: SMTP_PASS
        value: your_app_password
      - key: ADMIN_CONTACT_EMAIL
        value: admin@edulearn.com
      - key: EMAIL_FROM
        value: "EduLearn Platform <admin@edulearn.com>"

databases:
  - name: edulearn-db
    databaseName: edulearn_db
    user: edulearn_user
    plan: free
